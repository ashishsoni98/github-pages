<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashish IPL match prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f2;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: yellow;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        select, button {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
        }
        #result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Ashish IPL Match Predictor</h2>
        <label for="team1">Select Team 1:</label>
        <select id="team1">
            <option value="RCB">Royal Challengers Bengaluru</option>
            <option value="KKR">Kolkata Knight Riders</option>
            <option value="CSK">Chennai Super Kings</option>
            <option value="MI">Mumbai Indians</option>
            <option value="SRH">Sunrisers Hyderabad</option>
            <option value="DC">Delhi Capitals</option>
            <option value="RR">Rajasthan Royals</option>
            <option value="PBKS">Punjab Kings</option>
            <option value="GT">Gujarat Titans</option>
            <option value="LSG">Lucknow Super Giants</option>
        </select>

        <label for="team2">Select Team 2:</label>
        <select id="team2">
            <option value="RCB">Royal Challengers Bengaluru</option>
            <option value="KKR">Kolkata Knight Riders</option>
            <option value="CSK">Chennai Super Kings</option>
            <option value="MI">Mumbai Indians</option>
            <option value="SRH">Sunrisers Hyderabad</option>
            <option value="DC">Delhi Capitals</option>
            <option value="RR">Rajasthan Royals</option>
            <option value="PBKS">Punjab Kings</option>
            <option value="GT">Gujarat Titans</option>
            <option value="LSG">Lucknow Super Giants</option>
        </select>

        <button onclick="predictMatch()">Predict Winner</button>

        <div id="result"></div>
    </div>

    <script>
        function predictMatch() {
            let team1 = document.getElementById("team1").value;
            let team2 = document.getElementById("team2").value;
            
            if (team1 === team2) {
                document.getElementById("result").innerText = "Select two different teams!";
                return;
            }

            let winner = Math.random() < 0.5 ? team1 : team2;
            document.getElementById("result").innerText = "Predicted Winner: " + winner;
        }
    </script>

</body>
</html>
